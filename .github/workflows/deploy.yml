name: Deploy tema Garuda ke 8 desa

# Men-deploy tema Garuda (base, garuda-blade, dan seluruh varian ternama —
# bernomor maupun bernama) ke kedelapan instalasi desa di server (rsync via SSH,
# tanpa Docker). Berjalan otomatis saat berkas tema berubah pada branch main,
# atau dapat dipicu manual (workflow_dispatch).
#
# CAKUPAN SENGAJA DIBATASI PADA TEMA.
# Kedelapan desa menjalankan EDISI OpenSID yang berbeda-beda. Men-sinkronkan
# seluruh pohon kode aplikasi lewat satu sumber akan MENURUNKAN/merusak edisi
# yang berbeda. Tema bersifat mandiri & netral-versi, sehingga aman dideploy ke
# semua desa. Perbaikan kode dilakukan terpisah (lihat DEPLOY.md).

on:
  push:
    branches: [main]
    paths:
      - 'desa/themes/garuda/**'
      - 'desa/themes/garuda-blade/**'
      - 'desa/themes/garuda-ternama-*/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tema
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain:
          - pabeanudik.desa.id
          - singaraja-indramayu.desa.id
          - karangsong-indramayu.desa.id
          - tambak-indramayu.desa.id
          - dukuh-indramayu.desa.id
          - pekandangan-indramayu.desa.id
          - plumbon-indramayu.desa.id
          - telukagung-indramayu.desa.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan kunci SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Daftar tema ditemukan dari isi repo, bukan daftar keras — dulu loop-nya
      # hanya menyebut garuda-ternama-1..9 sehingga varian BERNAMA (mis.
      # garuda-ternama-11-tari-topeng, yang justru dipakai Pekandangan) tak
      # pernah ikut ter-deploy.
      - name: Rsync tema Garuda
        run: |
          DEST="domains/${{ matrix.domain }}/public_html/desa/themes"
          SSHCMD="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o IdentitiesOnly=yes"
          for src in desa/themes/garuda desa/themes/garuda-blade desa/themes/garuda-ternama-*; do
            [ -d "$src" ] || continue
            t=$(basename "$src")
            echo "::group::rsync $t"
            rsync -az --delete -e "$SSHCMD" \
              "$src/" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEST/$t/"
            echo "::endgroup::"
          done

      - name: Perbaiki izin + bersihkan cache tema
        run: |
          ROOT="domains/${{ matrix.domain }}/public_html"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
              find $ROOT/desa/themes/garuda* -type d -exec chmod 755 {} + ;
              find $ROOT/desa/themes/garuda* -type f -exec chmod 644 {} + ;
              rm -rf $ROOT/storage/framework/cache/data/* 2>/dev/null;
              true
            "

      # Verifikasi menembak ORIGIN (--resolve), bukan CDN: karangsong berada di
      # belakang tantangan anti-bot Hostinger CDN yang membalas 403 ke klien
      # non-browser walaupun situsnya sehat — lewat CDN langkah ini gagal palsu.
      - name: Verifikasi situs merespons
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 \
            --resolve "${{ matrix.domain }}:443:${{ secrets.SSH_HOST }}" \
            "https://${{ matrix.domain }}/")
          echo "https://${{ matrix.domain }}/ (origin) -> HTTP $code"
          test "$code" = "200"
